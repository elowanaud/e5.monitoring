services:
  prometheus:
    image: prom/prometheus:latest
    # ports:
    #   - "9090:9090"
    deploy:
      placement:
        constraints:
          - node.role == manager
    volumes:
      - ./config:/config:ro
      - prometheus_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--config.file=/config/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    # ports:
      # - "3000:3000"
    deploy:
      placement:
        constraints:
          - node.role == manager
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboard-definitions:/var/lib/grafana/dashboards:ro

  node_exporter:
    image: prom/node-exporter:latest
    # ports:
    #   - "9100:9100"
    deploy:
      mode: global
    networks:
      - hostnet
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
    volumes:
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
      - '/:/host/root:ro,rslave'

  # cadvisor:
  #   image: google/cadvisor:latest
  #   # ports:
  #   #   - "8080:8080"
  #   deploy:
  #     mode: global
  #     resources:
  #       limits:
  #         memory: 128M
  #       reservations:
  #         memory: 64M
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /:/rootfs:ro
  #     - /var/run:/var/run
  #     - /sys:/sys:ro
  #     - /var/lib/docker/:/var/lib/docker:ro
  #   command: 
  #     - -logtostderr
  #     - -docker_only


volumes:
  prometheus_data:
  grafana_data:

networks:
  hostnet:
    external: true
    name: host
