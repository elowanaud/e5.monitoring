services:
  prometheus:
    image: prom/prometheus:latest
    # ports:
    #   - "9090:9090"
    volumes:
      - /etc/prometheus/:/config
      - prometheus_data:/prometheus
    command:
      - "--config.file=/config/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    # ports:
      # - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data: